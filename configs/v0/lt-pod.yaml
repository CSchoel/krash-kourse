apiVersion: v1
kind: Pod
metadata:
  name: lt-pod
  labels:
    app: languagetool
spec:
  containers:
    - name: lt
      image: erikvl87/languagetool:6.7-dockerupdate-3
      ports:
        - containerPort: 8010
      volumeMounts:
        - mountPath: /LanguageTool/lockback.xml
          name: tmpfs-storage
          subPath: lockback.xml
  volumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 500Mi
      name: tmpfs-storage
